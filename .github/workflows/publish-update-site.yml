# Compila o plugin com Tycho e publica o update site p2 no GitHub Pages.
name: Publicar update site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build do plugin e do update site (Tycho)
        run: mvn -B clean verify

      - name: Página inicial e .nojekyll
        run: |
          cp .github/site/index.html com.brainconsulting.adt.mcp.site/target/repository/index.html
          touch com.brainconsulting.adt.mcp.site/target/repository/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: com.brainconsulting.adt.mcp.site/target/repository

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4