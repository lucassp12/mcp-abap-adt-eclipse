# /etc/nginx/sites-available/mcp-abap-adt.conf
# Troque updates.seudominio.com.br pelo domínio que aponta para a VPS.
server {
    listen 80;
    listen [::]:80;
    server_name updates.seudominio.com.br;

    # O workflow publica em releases/<versão> e aponta "current" para a última.
    root /var/www/mcp-abap-adt-site/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Metadados do p2 mudam a cada publicação: sem cache longo.
    location ~ ^/(p2\.index|artifacts\.(jar|xml\.xz)|content\.(jar|xml\.xz))$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
